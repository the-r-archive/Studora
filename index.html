<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060a08" />
  <meta name="description" content="STUDORA — a calm, focused study space for students." />
  <title>STUDORA — Your Study OS</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="orb-field" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="Studora home">
        <img src="assets/studora-logo.png" alt="" width="44" height="45" />
        <span class="brand-copy">
          <span class="brand-name">STUDORA</span>
          <small>YOUR STUDY OS</small>
        </span>
      </a>

      <p class="side-label">Workspace</p>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Overview</span></button>
        <button class="nav-item" data-page="tasks"><i data-lucide="list-checks"></i><span>My tasks</span><span class="nav-count" id="navTaskCount">0</span></button>
        <button class="nav-item" data-page="focus"><i data-lucide="timer"></i><span>Focus room</span></button>
        <button class="nav-item" data-page="subjects"><i data-lucide="library"></i><span>Subjects</span></button>
        <button class="nav-item" data-page="notes"><i data-lucide="notebook-pen"></i><span>Notes</span></button>
      </nav>

      <p class="side-label side-label-spaced">Personal</p>
      <nav class="side-nav" aria-label="Personal navigation">
        <button class="nav-item" data-page="analytics"><i data-lucide="chart-no-axes-combined"></i><span>Analytics</span></button>
        <button class="nav-item" data-page="settings"><i data-lucide="settings-2"></i><span>Settings</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="streak-card">
          <span class="streak-icon"><i data-lucide="flame"></i></span>
          <div class="streak-copy">
            <strong id="streakDays">0 day streak</strong>
            <p id="streakHint">Finish a task to begin.</p>
          </div>
          <i class="streak-arrow" data-lucide="arrow-up-right"></i>
        </div>
        <div class="profile-row">
          <span class="avatar" id="profileInitial">S</span>
          <div class="profile-copy">
            <strong id="profileName">Student</strong>
            <span id="profileMeta">Sign in to save</span>
          </div>
          <button class="icon-btn tiny" id="sidebarMore" aria-label="More options"><i data-lucide="ellipsis"></i></button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <a class="topbar-brand" href="#" data-page="dashboard" aria-label="Studora home">
            <img src="assets/studora-logo.png" alt="" width="30" height="31" />
            <span>STUDORA</span>
          </a>
          <div class="breadcrumb">
            <span>Workspace</span>
            <i data-lucide="chevron-right"></i>
            <strong id="breadcrumbCurrent">Overview</strong>
          </div>
        </div>
        <div class="top-actions">
          <div class="date-pill"><i data-lucide="calendar-days"></i><span id="todayDate">Today</span></div>
          <button class="icon-btn" id="themeToggle" aria-label="Switch color theme"><i data-lucide="sun-moon"></i></button>
          <button class="avatar top-avatar" id="topAvatar" aria-label="Profile and settings">S</button>
        </div>
      </header>

      <section class="page-content" id="pageContent"></section>

      <footer class="page-footer">
        <span>STUDORA <b>·</b> Make today count.</span>
        <span>Designed for focus, built for progress.</span>
      </footer>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="mobile-nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Home</span></button>
    <button class="mobile-nav-item" data-page="tasks"><i data-lucide="list-checks"></i><span>Tasks</span></button>
    <button class="mobile-nav-item" data-page="focus"><i data-lucide="timer"></i><span>Focus</span></button>
    <button class="mobile-nav-item" data-page="subjects"><i data-lucide="library"></i><span>Subjects</span></button>
    <button class="mobile-nav-item" data-page="notes"><i data-lucide="notebook-pen"></i><span>Notes</span></button>
    <button class="mobile-nav-item" data-page="analytics"><i data-lucide="chart-no-axes-combined"></i><span>Stats</span></button>
  </nav>

  <div class="toast" id="toast" role="status"></div>

  <dialog class="sheet" id="taskDialog" aria-labelledby="taskDialogTitle">
    <form id="taskForm" class="sheet-form">
      <div class="sheet-head">
        <div><p class="kicker">New task</p><h3 id="taskDialogTitle">Add to your day</h3></div>
        <button type="button" class="icon-btn" data-close-dialog aria-label="Close"><i data-lucide="x"></i></button>
      </div>
      <label class="field"><span>Task</span><input id="taskTitle" maxlength="90" required placeholder="e.g. Revise thermodynamics notes" autocomplete="off"></label>
      <div class="field-row">
        <label class="field"><span>Subject</span><select id="taskSubject"></select></label>
        <label class="field"><span>Priority</span>
          <select id="taskPriority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
      </div>
      <label class="field"><span>Due date</span><input type="date" id="taskDue"></label>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Cancel</button>
        <button type="submit" class="btn btn-primary"><i data-lucide="plus"></i> Add task</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="subjectDialog" aria-labelledby="subjectDialogTitle">
    <form id="subjectForm" class="sheet-form">
      <div class="sheet-head">
        <div><p class="kicker">New subject</p><h3 id="subjectDialogTitle">Add a learning area</h3></div>
        <button type="button" class="icon-btn" data-close-dialog aria-label="Close"><i data-lucide="x"></i></button>
      </div>
      <label class="field"><span>Subject name</span><input id="subjectName" maxlength="30" required placeholder="e.g. Mathematics" autocomplete="off"></label>
      <label class="field"><span>Chapters planned</span><input id="subjectChapters" type="number" min="1" max="200" value="12"></label>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Cancel</button>
        <button type="submit" class="btn btn-primary"><i data-lucide="plus"></i> Add subject</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="script.js"></script>
</body>
</html>
